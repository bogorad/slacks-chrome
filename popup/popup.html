<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Favicon Customizer</title>
    <link rel="stylesheet" href="../css/popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="popup-header">
        <h1>Slacks</h1>
        <p class="subtitle">Slack favicon unread markers</p>
      </header>

      <main class="settings-list">
        <div class="option-group">
          <label class="toggle-switch">
            <input type="checkbox" id="enableExtension" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">Enable</span>
          </label>
        </div>

        <div class="option-group">
          <label class="toggle-switch">
            <input type="checkbox" id="showNotificationDot" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">Notify of unread</span>
          </label>
        </div>

        <div class="option-group color-group" id="generalColorGroup">
          <div class="color-group-header">General ring color</div>
          <div class="color-options" role="group" aria-label="General ring color">
            <button type="button" class="color-option color-pink" data-color-target="generalColor" data-color="pink" aria-label="Pink" title="Pink"></button>
            <button type="button" class="color-option color-red" data-color-target="generalColor" data-color="red" aria-label="Red" title="Red"></button>
            <button type="button" class="color-option color-green" data-color-target="generalColor" data-color="green" aria-label="Green" title="Green"></button>
            <button type="button" class="color-option color-navy" data-color-target="generalColor" data-color="navy" aria-label="Navy" title="Navy"></button>
            <button type="button" class="color-option color-yellow" data-color-target="generalColor" data-color="yellow" aria-label="Yellow" title="Yellow"></button>
          </div>
        </div>

        <div class="option-group color-group" id="personalColorGroup">
          <div class="color-group-header">Personal dot color</div>
          <div class="color-options" role="group" aria-label="Personal dot color">
            <button type="button" class="color-option color-pink" data-color-target="personalColor" data-color="pink" aria-label="Pink" title="Pink"></button>
            <button type="button" class="color-option color-red" data-color-target="personalColor" data-color="red" aria-label="Red" title="Red"></button>
            <button type="button" class="color-option color-green" data-color-target="personalColor" data-color="green" aria-label="Green" title="Green"></button>
            <button type="button" class="color-option color-navy" data-color-target="personalColor" data-color="navy" aria-label="Navy" title="Navy"></button>
            <button type="button" class="color-option color-yellow" data-color-target="personalColor" data-color="yellow" aria-label="Yellow" title="Yellow"></button>
          </div>
        </div>

        <div class="option-group">
          <label class="toggle-switch">
            <input type="checkbox" id="debugMode" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">Debug output</span>
          </label>
        </div>
      </main>
      <footer class="popup-footer">
        <div class="credits">
          Made in 🇩🇪 by
          <a class="brand-link" href="https://www.suprematic.net"
            >SUPREMATIC</a
          >
        </div>

        <div class="version">v1.1.18</div>
      </footer>
    </div>

    <script src="../js/popup.js"></script>
  </body>
</html>
