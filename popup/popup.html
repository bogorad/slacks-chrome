<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Favicon Customizer</title>
    <link rel="stylesheet" href="../css/popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Slacks</h1>
      </header>

      <main>
        <div class="option-group">
          <label class="toggle-switch">
            <input type="checkbox" id="enableExtension" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">Enable</span>
          </label>
        </div>

        <div class="option-group">
          <label class="toggle-switch">
            <input type="checkbox" id="showNotificationDot" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">Show notification dot</span>
          </label>
        </div>

        <div class="option-group">
          <label class="toggle-switch">
            <input type="checkbox" id="debugMode" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">Debug output</span>
          </label>
        </div>
      </main>
      <footer
        style="
          display: flex;
          flex-direction: row;
          justify-content: space-between;
        "
      >
        <div>
          Made in 🇩🇪 by
          <a href="https://www.suprematic.net" style="color: #bc0000"
            >SUPREMATIC</a
          >
        </div>

        <div style="color: grey">v1.1.10</div>
      </footer>
    </div>

    <script src="../js/popup.js"></script>
  </body>
</html>
